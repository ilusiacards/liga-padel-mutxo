<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liga Mutxo Padel</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0e1a" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Liga Mutxo Padel</h1>
    <div class="ligas-barra" id="ligas-barra">
      <select id="selector-liga" class="selector-liga" aria-label="Liga activa"></select>
      <div class="ligas-acciones">
        <button id="btn-liga-nueva" class="btn btn-secondary btn-mini">Nueva</button>
        <button id="btn-liga-renombrar" class="btn btn-secondary btn-mini">Renombrar</button>
        <button id="btn-liga-eliminar" class="btn btn-secondary btn-mini">Eliminar</button>
      </div>
    </div>
    <nav class="tab-nav" id="tab-nav">
      <button class="tab-btn active" data-tab="jugadores">Jugadores</button>
      <button class="tab-btn" data-tab="jornadas">Jornadas</button>
      <button class="tab-btn" data-tab="clasificacion">Clasificación</button>
    </nav>
  </header>

  <p id="banner-modo-consulta" class="banner-modo-consulta" hidden>Modo consulta — liga compartida por enlace</p>

  <main class="app-main">
    <section id="tab-jugadores" class="tab-section active">
      <div class="jugadores-columnas">
        <div class="columna-jugadores" id="columna-girls">
          <h2>Columna 1</h2>
          <div class="inputs-jugadores" id="inputs-girls"></div>
        </div>
        <div class="columna-jugadores" id="columna-boys">
          <h2>Columna 2</h2>
          <div class="inputs-jugadores" id="inputs-boys"></div>
        </div>
      </div>
      <div class="acciones-jugadores">
        <button id="btn-agregar-fila" class="btn btn-secondary btn-small">+ Añadir pareja</button>
        <button id="btn-generar-liga" class="btn btn-primary">Generar Liga</button>
      </div>
      <div class="acciones-datos">
        <button id="btn-exportar" class="btn btn-secondary">Exportar Datos</button>
        <label class="btn btn-secondary" for="input-importar">Importar Datos</label>
        <input type="file" id="input-importar" accept=".json" hidden />
        <button id="btn-compartir" class="btn btn-secondary">Compartir enlace</button>
      </div>
    </section>

    <section id="tab-jornadas" class="tab-section">
      <div class="acciones-jornadas">
        <button id="btn-publicar" class="btn btn-secondary">Publicar resultados</button>
      </div>
      <div id="jornadas-container"></div>
      <p id="jornadas-vacio" class="mensaje-vacio">Aún no se ha generado ninguna liga. Ve a la pestaña "Jugadores" y pulsa "Generar Liga".</p>
    </section>

    <section id="tab-clasificacion" class="tab-section">
      <div class="acciones-clasificacion">
        <button id="btn-imagen-clasificacion" class="btn btn-secondary">Sacar imagen</button>
      </div>
      <div class="tabla-wrapper" id="clasificacion-capturable">
        <table class="tabla-clasificacion">
          <thead>
            <tr>
              <th>Pos</th>
              <th>Jugador</th>
              <th>PJ</th>
              <th>PG</th>
              <th>Sets G</th>
              <th>Sets P</th>
              <th>Jueg G</th>
              <th>Jueg P</th>
              <th class="col-puntos">Puntos</th>
            </tr>
          </thead>
          <tbody id="clasificacion-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="loading-overlay" class="loading-overlay" hidden>
    <div class="loading-box">
      <div id="loading-spinner" class="spinner"></div>
      <div id="loading-check" class="loading-check" hidden>✓</div>
      <p id="loading-mensaje" class="loading-mensaje">Generando<span class="puntos"><span>.</span><span>.</span><span>.</span></span></p>
      <button id="loading-aceptar" class="btn btn-primary" hidden>Aceptar</button>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <p id="modal-mensaje"></p>
      <div class="modal-acciones">
        <button id="modal-cancelar" class="btn btn-secondary">Cancelar</button>
        <button id="modal-confirmar" class="btn btn-destructive">Continuar</button>
      </div>
    </div>
  </div>

  <div id="modal-texto-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <p id="modal-texto-mensaje"></p>
      <input type="text" id="modal-texto-input" class="modal-texto-input" maxlength="40" autocomplete="off" />
      <div class="modal-acciones">
        <button id="modal-texto-cancelar" class="btn btn-secondary">Cancelar</button>
        <button id="modal-texto-confirmar" class="btn btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <div id="modal-compartir-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <p id="modal-compartir-mensaje">¿Qué tipo de enlace quieres generar?</p>
      <div class="modal-compartir-opciones">
        <button id="btn-enlace-lectura" class="btn btn-secondary">Solo lectura (para el grupo)</button>
        <button id="btn-enlace-editable" class="btn btn-secondary">Copia completa (editable)</button>
      </div>
      <div class="modal-acciones">
        <button id="modal-compartir-cancelar" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="modal-ficha-overlay" class="modal-overlay" hidden>
    <div class="modal modal-ficha" id="modal-ficha">
      <div id="modal-ficha-cuerpo" class="modal-ficha-cuerpo"></div>
      <div class="modal-acciones">
        <button id="modal-ficha-imagen" class="btn btn-secondary no-captura">Sacar imagen</button>
        <button id="modal-ficha-cerrar" class="btn btn-primary no-captura">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="vendor/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
